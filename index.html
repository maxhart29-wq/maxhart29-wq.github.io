<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game thing</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2E6F40; /* green background */
            font-family: 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #content {
            display: none; /* Hidden until the user clicks enter */
            text-align: center;
            font-size: 5rem; /* Makes the text very big */
            color: #111;
            text-transform: uppercase;
            animation: bounce 0.5s infinite alternate; /* Adds a fun bouncing effect */
        }

        #enter-btn {
            padding: 20px 40px;
            font-size: 2rem;
            background-color: #008cba;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        #skip-btn{
            display: none;
            padding: 10px 20px;
            font-size: 1rem;
            color: black;
            cursor: pointer;
            position: fixed;   /* Stays fixed in the screen viewport */
            bottom: 20px;      /* 20px distance from the bottom */
            right: 20px;   
        }
        #scare {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #image {
            display: none;
            padding: 50px 50px;
        }
        #enter-btn:hover {
            background-color: #007399;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <!-- The initial click button to bypass browser audio blocks -->
    <button id="enter-btn" onclick="startPage()">Click to Enter</button>
    <button id="skip-btn" onclick="skip()">click to skip audio</botton>
    <!-- The big text container -->
    <div id="content">
        🐧u got penguin🐧
    </div>

    <!-- The audio element -->
    <!-- REPLACE 'your-audio-file.mp3' with your actual MP3 link -->
    <audio id="bg-audio" src="music.mp3" loop></audio>
    <img id="image" src="image.jpeg">
    <img id="scare" scr="scary.jpeg">
    
    <script>
        function startPage() {
            // Hide the enter button
            document.getElementById('enter-btn').style.display = 'none';
            //shows image
            document.getElementById('image').style.display = 'block'
            // Show the big penguin text
            document.getElementById('content').style.display = 'block';

            document.getElementById('scare').style.display = 'none';
            // Play the MP3 audio
            var audio = document.getElementById('bg-audio');
            audio.play().catch(function(error) {
                console.log("Audio playback failed:", error);
            document. getElementById('skip-btn').style.display = 'block'
            });
        }
        function skip() {
             document.getElementById('enter-btn').style.display = 'none';
            //shows image
            document.getElementById('image').style.display = 'none'
            // Show the big penguin text
            document.getElementById('content').style.display = 'none';

            document.getElementById9('skip-btn').style.display = 'none';

            document.getElementById('scare').style.display = 'block';
            var audio = document.getElementById('bg-audio');
            audio.stop().catch(function(error) {
                console.log("Audio playback failed:", error);
            });
        }
    </script>

</body>
</html>
