<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguins!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* Light blue background */
            font-family: 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #content {
            display: none; /* Hidden until the user clicks enter */
            text-align: center;
            font-size: 5rem; /* Makes the text very big */
            color: #111;
            text-transform: uppercase;
            animation: bounce 0.5s infinite alternate; /* Adds a fun bouncing effect */
        }

        #enter-btn {
            padding: 20px 40px;
            font-size: 2rem;
            background-color: #008cba;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #enter-btn:hover {
            background-color: #007399;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <!-- The initial click button to bypass browser audio blocks -->
    <button id="enter-btn" onclick="startPage()">Click to Enter</button>

    <!-- The big text container -->
    <div id="content">
        u got penguins
    </div>

    <!-- The audio element -->
    <!-- REPLACE 'your-audio-file.mp3' with your actual MP3 link -->
    <audio id="bg-audio" src="music.mp3" loop></audio>

    <script>
        function startPage() {
            // Hide the enter button
            document.getElementById('enter-btn').style.display = 'none';
            
            // Show the big penguin text
            document.getElementById('content').style.display = 'block';
            
            // Play the MP3 audio
            var audio = document.getElementById('bg-audio');
            audio.play().catch(function(error) {
                console.log("Audio playback failed:", error);
            });
        }
    </script>

</body>
</html>
